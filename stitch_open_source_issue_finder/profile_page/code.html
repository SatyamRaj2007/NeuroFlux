<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#7ffc97",
                    "primary-container": "#7ffc97",
                    "on-primary": "#e4ffe2",
                    "inverse-primary": "#82ff99",
                    "on-tertiary-container": "#466250",
                    "on-surface": "#2a3434",
                    "error-dim": "#5c1202",
                    "outline": "#727d7c",
                    "primary-dim": "#006027",
                    "inverse-surface": "#0b0f0f",
                    "surface-dim": "#cfdddb",
                    "on-background": "#2a3434",
                    "on-tertiary": "#e7ffec",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#5d605b",
                    "secondary-container": "#e2e3dd",
                    "on-tertiary-fixed-variant": "#506d5a",
                    "surface-variant": "#dae5e4",
                    "on-primary-fixed-variant": "#006a2c",
                    "tertiary": "#496553",
                    "surface-container-low": "#f0f4f3",
                    "tertiary-container": "#dbfce4",
                    "surface-bright": "#f8faf9",
                    "surface-container-highest": "#dae5e4",
                    "error-container": "#fe8b70",
                    "secondary-fixed-dim": "#d4d5cf",
                    "on-tertiary-fixed": "#34503e",
                    "on-secondary-fixed": "#3d403c",
                    "on-surface-variant": "#576160",
                    "on-secondary-fixed-variant": "#5a5c58",
                    "inverse-on-surface": "#9b9d9d",
                    "surface": "#f8faf9",
                    "on-secondary-container": "#50524e",
                    "tertiary-fixed-dim": "#cdedd6",
                    "on-primary-fixed": "#004a1c",
                    "secondary-dim": "#515450",
                    "on-secondary": "#f8f9f4",
                    "surface-container-high": "#e1eae9",
                    "secondary-fixed": "#e2e3dd",
                    "error": "#9e422c",
                    "tertiary-fixed": "#dbfce4",
                    "surface-tint": "#006e2d",
                    "surface-container": "#e9efee",
                    "tertiary-dim": "#3d5948",
                    "primary": "#006e2d",
                    "outline-variant": "#a9b4b3",
                    "primary-fixed-dim": "#70ed8a",
                    "on-primary-container": "#005f27",
                    "on-error-container": "#742410",
                    "on-error": "#fff7f6",
                    "background": "#f8faf9"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cloud-shadow {
            box-shadow: 0 12px 32px -4px rgba(42, 52, 52, 0.04);
        }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen">
<!-- TopNavBar -->
<header class="fixed top-0 w-full z-50 bg-emerald-50 dark:bg-[#1a1c1b]">
<div class="flex justify-between items-center px-6 py-3 w-full max-w-[1440px] mx-auto">
<div class="flex items-center gap-8">
<span class="text-xl font-bold tracking-tight text-[#2a3434] dark:text-emerald-50">FirstPR Pro</span>
<nav class="hidden md:flex items-center gap-6 font-['Inter'] body-md tracking-tight">
<a class="text-[#576160] dark:text-gray-400 hover:text-[#2a3434] transition-colors duration-150" href="#">Discover</a>
<a class="text-[#576160] dark:text-gray-400 hover:text-[#2a3434] transition-colors duration-150" href="#">Bookmarks</a>
<a class="text-[#006e2d] dark:text-emerald-400 font-semibold border-b-2 border-[#006e2d] pb-1" href="#">Profile</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-[#e1eae9] dark:hover:bg-[#2d3231] transition-colors duration-150 active:scale-95">
<span class="material-symbols-outlined text-[#006e2d]">menu</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant/20">
<img alt="User profile" class="w-full h-full object-cover" data-alt="close-up portrait of a professional developer in a clean studio setting with soft directional lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD00bfEZ1-tFPW8QOQmmPjchn2jHTRsm5YpciQK6c4jsk44aM9V3805QL-RFOyCMn3tKWUG6tvKsDF4ZTC3j_3kDRC_13dCur09ztg_KoNzVfFbXtdaY-jJjfQZ4vi1cnhK9gWDorZgANDzKX_w5EncxnF1MinkydwZ8ZqK_dqWU5k1_vfUwcoEfBE3zB9qhb1AXOi7nQqGvdwvWgngWblmqjPBDvUqpVRaMtcn8eEPe0VrjlnLN_RSsV27ix2lHxaZCuH2_UkwWs8"/>
</div>
</div>
</div>
</header>
<main class="pt-24 pb-20 px-4 max-w-4xl mx-auto">
<!-- Profile Header Section -->
<div class="flex flex-col items-center mb-10 text-center">
<div class="relative group mb-4">
<div class="w-24 h-24 rounded-full overflow-hidden cloud-shadow border-4 border-surface-container-lowest">
<img class="w-full h-full object-cover" data-alt="professional headshot of a software engineer with a neutral background and warm ambient lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDc-PCrJqMAzP-_ZJGAv-RiokfuVAj11Cqr56HOTMuU8-0PRcxSOD6BoGOBwBkGgpiQ13svvWZ6nJ8MdfKlFCNRasijK2joLgvU6hOEwV--eJAnuW-0BlANZOSCOw3iPUGdKm6b4tyGjYia4fXPyagwPAPwvpk5ly1a2QerlWskSb9gJn_1f78WV4XiC_dQZTZ9kEO89cOEI8Yl72hB17dt0BMty-fj0IstB7rq3uA_jmbfdA5bIXiW7CbUnxXKXPA_frCUP8jz92o"/>
</div>
<button class="absolute bottom-0 right-0 p-1.5 bg-primary text-on-primary rounded-full cloud-shadow active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>
<h1 class="text-2xl font-bold tracking-tight text-on-surface">Alex Rivera</h1>
<p class="text-on-surface-variant font-['Inter'] body-md mt-1">Full-stack Developer • Open Source Contributor</p>
</div>
<!-- Main Content Grid -->
<div class="space-y-6">
<!-- User Info Card -->
<section class="bg-surface-container-lowest rounded-xl p-8 cloud-shadow border border-outline-variant/10">
<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
<h2 class="font-bold text-lg tracking-tight">User Info</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Full Name</label>
<input class="w-full px-4 py-2.5 rounded-lg bg-surface-container-low border border-outline-variant/20 focus:border-primary focus:ring-0 transition-colors body-md" type="text" value="Alex Rivera"/>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Email Address</label>
<input class="w-full px-4 py-2.5 rounded-lg bg-surface-container-low border border-outline-variant/20 focus:border-primary focus:ring-0 transition-colors body-md" type="email" value="alex.rivera@firstpr.pro"/>
</div>
<div class="md:col-span-2 space-y-1.5">
<label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Bio</label>
<textarea class="w-full px-4 py-2.5 rounded-lg bg-surface-container-low border border-outline-variant/20 focus:border-primary focus:ring-0 transition-colors body-md resize-none" rows="3">Passionate about building scalable web applications and improving documentation for emerging open-source projects.</textarea>
</div>
</div>
</section>
<!-- Experience Level Card -->
<section class="bg-surface-container-lowest rounded-xl p-8 cloud-shadow border border-outline-variant/10">
<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">military_tech</span>
<h2 class="font-bold text-lg tracking-tight">Experience Level</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<label class="relative flex items-center p-4 rounded-lg bg-surface-container-low border-2 border-transparent cursor-pointer has-[:checked]:border-primary transition-all">
<input checked="" class="hidden" name="exp" type="radio"/>
<div class="flex flex-col">
<span class="font-semibold body-md">Contributor</span>
<span class="text-xs text-on-surface-variant">0-5 Merged PRs</span>
</div>
<span class="material-symbols-outlined ml-auto text-primary opacity-0 peer-checked:opacity-100">check_circle</span>
</label>
<label class="relative flex items-center p-4 rounded-lg bg-surface-container-low border-2 border-transparent cursor-pointer has-[:checked]:border-primary transition-all">
<input class="hidden" name="exp" type="radio"/>
<div class="flex flex-col">
<span class="font-semibold body-md">Maintainer</span>
<span class="text-xs text-on-surface-variant">5-50 Merged PRs</span>
</div>
<span class="material-symbols-outlined ml-auto text-primary opacity-0 peer-checked:opacity-100">check_circle</span>
</label>
<label class="relative flex items-center p-4 rounded-lg bg-surface-container-low border-2 border-transparent cursor-pointer has-[:checked]:border-primary transition-all">
<input class="hidden" name="exp" type="radio"/>
<div class="flex flex-col">
<span class="font-semibold body-md">Architect</span>
<span class="text-xs text-on-surface-variant">50+ Merged PRs</span>
</div>
<span class="material-symbols-outlined ml-auto text-primary opacity-0 peer-checked:opacity-100">check_circle</span>
</label>
</div>
</section>
<!-- Skills Card -->
<section class="bg-surface-container-lowest rounded-xl p-8 cloud-shadow border border-outline-variant/10">
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">terminal</span>
<h2 class="font-bold text-lg tracking-tight">Skills</h2>
</div>
<button class="text-primary text-sm font-semibold hover:underline">Add New</button>
</div>
<div class="flex flex-wrap gap-2 mb-6">
<div class="group flex items-center gap-2 px-3 py-1.5 rounded bg-tertiary-container text-on-tertiary-container label-md">
<span>TypeScript</span>
<button class="material-symbols-outlined text-sm hover:text-error transition-colors">close</button>
</div>
<div class="group flex items-center gap-2 px-3 py-1.5 rounded bg-tertiary-container text-on-tertiary-container label-md">
<span>React</span>
<button class="material-symbols-outlined text-sm hover:text-error transition-colors">close</button>
</div>
<div class="group flex items-center gap-2 px-3 py-1.5 rounded bg-tertiary-container text-on-tertiary-container label-md">
<span>Node.js</span>
<button class="material-symbols-outlined text-sm hover:text-error transition-colors">close</button>
</div>
<div class="group flex items-center gap-2 px-3 py-1.5 rounded bg-tertiary-container text-on-tertiary-container label-md">
<span>GraphQL</span>
<button class="material-symbols-outlined text-sm hover:text-error transition-colors">close</button>
</div>
<div class="group flex items-center gap-2 px-3 py-1.5 rounded bg-tertiary-container text-on-tertiary-container label-md">
<span>TailwindCSS</span>
<button class="material-symbols-outlined text-sm hover:text-error transition-colors">close</button>
</div>
<div class="group flex items-center gap-2 px-3 py-1.5 rounded bg-tertiary-container text-on-tertiary-container label-md">
<span>PostgreSQL</span>
<button class="material-symbols-outlined text-sm hover:text-error transition-colors">close</button>
</div>
</div>
<div class="relative">
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-surface-container-low border border-outline-variant/20 focus:border-primary focus:ring-0 body-md" placeholder="Search or type a new skill..." type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col md:flex-row items-center justify-between gap-4 pt-6">
<div class="flex items-center gap-4 w-full md:w-auto">
<button class="w-full md:w-auto px-8 py-3 bg-primary text-on-primary rounded-xl font-bold body-md cloud-shadow hover:bg-primary-dim transition-colors active:scale-95">
                        Save Changes
                    </button>
<button class="w-full md:w-auto px-8 py-3 bg-secondary-container text-on-secondary-container rounded-xl font-semibold body-md hover:bg-surface-container-highest transition-colors active:scale-95">
                        Reset
                    </button>
</div>
<div class="h-px w-full md:hidden bg-outline-variant/20 my-2"></div>
<button class="flex items-center gap-2 px-6 py-3 text-error font-semibold hover:bg-error-container/10 rounded-xl transition-colors active:scale-95">
<span class="material-symbols-outlined">logout</span>
                    Sign Out
                </button>
</div>
</div>
</main>
<!-- Navigation Shell Support (Responsive) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-emerald-50 dark:bg-[#1a1c1b] flex justify-around items-center py-4 z-50">
<a class="flex flex-col items-center gap-1 text-[#576160]" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="text-[10px] font-medium">Discover</span>
</a>
<a class="flex flex-col items-center gap-1 text-[#576160]" href="#">
<span class="material-symbols-outlined">bookmarks</span>
<span class="text-[10px] font-medium">Bookmarks</span>
</a>
<a class="flex flex-col items-center gap-1 text-[#006e2d]" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-bold">Profile</span>
</a>
</nav>
</body></html>
