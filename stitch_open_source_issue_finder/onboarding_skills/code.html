<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FirstPR Pro - Skill Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#7ffc97",
                    "primary-container": "#7ffc97",
                    "on-primary": "#e4ffe2",
                    "inverse-primary": "#82ff99",
                    "on-tertiary-container": "#466250",
                    "on-surface": "#2a3434",
                    "error-dim": "#5c1202",
                    "outline": "#727d7c",
                    "primary-dim": "#006027",
                    "inverse-surface": "#0b0f0f",
                    "surface-dim": "#cfdddb",
                    "on-background": "#2a3434",
                    "on-tertiary": "#e7ffec",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#5d605b",
                    "secondary-container": "#e2e3dd",
                    "on-tertiary-fixed-variant": "#506d5a",
                    "surface-variant": "#dae5e4",
                    "on-primary-fixed-variant": "#006a2c",
                    "tertiary": "#496553",
                    "surface-container-low": "#f0f4f3",
                    "tertiary-container": "#dbfce4",
                    "surface-bright": "#f8faf9",
                    "surface-container-highest": "#dae5e4",
                    "error-container": "#fe8b70",
                    "secondary-fixed-dim": "#d4d5cf",
                    "on-tertiary-fixed": "#34503e",
                    "on-secondary-fixed": "#3d403c",
                    "on-surface-variant": "#576160",
                    "on-secondary-fixed-variant": "#5a5c58",
                    "inverse-on-surface": "#9b9d9d",
                    "surface": "#f8faf9",
                    "on-secondary-container": "#50524e",
                    "tertiary-fixed-dim": "#cdedd6",
                    "on-primary-fixed": "#004a1c",
                    "secondary-dim": "#515450",
                    "on-secondary": "#f8f9f4",
                    "surface-container-high": "#e1eae9",
                    "secondary-fixed": "#e2e3dd",
                    "error": "#9e422c",
                    "tertiary-fixed": "#dbfce4",
                    "surface-tint": "#006e2d",
                    "surface-container": "#e9efee",
                    "tertiary-dim": "#3d5948",
                    "primary": "#006e2d",
                    "outline-variant": "#a9b4b3",
                    "primary-fixed-dim": "#70ed8a",
                    "on-primary-container": "#005f27",
                    "on-error-container": "#742410",
                    "on-error": "#fff7f6",
                    "background": "#f8faf9"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8faf9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Header (Suppressed Nav Shell per Rule: Transactional Onboarding) -->
<header class="w-full px-6 py-8 flex justify-center">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
<span class="material-symbols-outlined text-surface text-xl" style="font-variation-settings: 'FILL' 1;">code</span>
</div>
<span class="text-xl font-bold tracking-tight text-on-surface">FirstPR Pro</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 pb-20">
<!-- Onboarding Card -->
<div class="w-full max-w-xl bg-surface-container-lowest rounded-xl p-8 md:p-12 border border-outline-variant/20 shadow-[0_12px_32px_-4px_rgba(42,52,52,0.04)]">
<!-- Step Indicator -->
<div class="flex items-center gap-2 mb-8">
<div class="h-1 w-12 bg-primary rounded-full"></div>
<div class="h-1 w-12 bg-surface-container-high rounded-full"></div>
<div class="h-1 w-12 bg-surface-container-high rounded-full"></div>
<span class="ml-4 text-xs font-semibold text-on-surface-variant uppercase tracking-widest">Step 1 of 3</span>
</div>
<!-- Content -->
<h1 class="text-3xl font-bold tracking-tight text-on-surface mb-2">Select your skills</h1>
<p class="text-on-surface-variant body-md mb-10">We'll use these to suggest the best first issues and pull requests for you to tackle.</p>
<!-- Search Area -->
<div class="space-y-6">
<div class="relative">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl focus:ring-0 focus:border-primary text-on-surface placeholder:text-outline transition-all duration-200 outline-none" placeholder="Search skills (e.g. React, Rust, Documentation)" type="text"/>
<!-- Instant Suggestions Overlay (Mockup) -->
<div class="absolute top-full left-0 right-0 mt-2 bg-surface-container-lowest border border-outline-variant/20 rounded-xl shadow-[0_12px_32px_-4px_rgba(42,52,52,0.08)] z-10 overflow-hidden">
<div class="px-4 py-3 hover:bg-surface-container-low cursor-pointer flex justify-between items-center group">
<span class="text-on-surface">TypeScript</span>
<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity">add_circle</span>
</div>
<div class="px-4 py-3 hover:bg-surface-container-low cursor-pointer flex justify-between items-center group">
<span class="text-on-surface">React Native</span>
<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity">add_circle</span>
</div>
</div>
</div>
<!-- Selected Chips -->
<div class="space-y-3">
<h3 class="text-xs font-bold text-on-surface-variant uppercase tracking-widest">Your Selection</h3>
<div class="flex flex-wrap gap-2">
<!-- Skill Chip: JavaScript -->
<div class="inline-flex items-center gap-2 px-3 py-1.5 bg-tertiary-container text-on-tertiary-container rounded-lg border border-tertiary-container/50 transition-all hover:bg-tertiary-container/80 cursor-default">
<span class="label-md font-medium">JavaScript</span>
<button class="flex items-center justify-center hover:bg-on-tertiary-container/10 rounded-full p-0.5">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<!-- Skill Chip: Python -->
<div class="inline-flex items-center gap-2 px-3 py-1.5 bg-tertiary-container text-on-tertiary-container rounded-lg border border-tertiary-container/50 transition-all hover:bg-tertiary-container/80 cursor-default">
<span class="label-md font-medium">Python</span>
<button class="flex items-center justify-center hover:bg-on-tertiary-container/10 rounded-full p-0.5">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<!-- Skill Chip: C++ -->
<div class="inline-flex items-center gap-2 px-3 py-1.5 bg-tertiary-container text-on-tertiary-container rounded-lg border border-tertiary-container/50 transition-all hover:bg-tertiary-container/80 cursor-default">
<span class="label-md font-medium">C++</span>
<button class="flex items-center justify-center hover:bg-on-tertiary-container/10 rounded-full p-0.5">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</div>
<!-- Suggested Grid -->
<div class="pt-4 border-t border-outline-variant/10">
<h3 class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-4">Popular for first-timers</h3>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
<button class="flex items-center justify-center gap-2 px-4 py-3 border border-outline-variant/20 rounded-xl text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="label-md">Bash</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-3 border border-outline-variant/20 rounded-xl text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="label-md">Docs</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-3 border border-outline-variant/20 rounded-xl text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">database</span>
<span class="label-md">SQL</span>
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-12 flex items-center justify-between">
<button class="text-on-surface-variant font-semibold px-4 py-2 hover:text-on-surface transition-colors">
                    Skip for now
                </button>
<button class="bg-[#16A34A] hover:bg-[#15803d] text-white px-8 py-3 rounded-xl font-bold transition-all transform active:scale-95 flex items-center gap-2">
                    Next Step
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[5%] right-[5%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
