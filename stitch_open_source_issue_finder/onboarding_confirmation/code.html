<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FirstPR Pro - Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#7ffc97",
                      "primary-container": "#7ffc97",
                      "on-primary": "#e4ffe2",
                      "inverse-primary": "#82ff99",
                      "on-tertiary-container": "#466250",
                      "on-surface": "#2a3434",
                      "error-dim": "#5c1202",
                      "outline": "#727d7c",
                      "primary-dim": "#006027",
                      "inverse-surface": "#0b0f0f",
                      "surface-dim": "#cfdddb",
                      "on-background": "#2a3434",
                      "on-tertiary": "#e7ffec",
                      "surface-container-lowest": "#ffffff",
                      "secondary": "#5d605b",
                      "secondary-container": "#e2e3dd",
                      "on-tertiary-fixed-variant": "#506d5a",
                      "surface-variant": "#dae5e4",
                      "on-primary-fixed-variant": "#006a2c",
                      "tertiary": "#496553",
                      "surface-container-low": "#f0f4f3",
                      "tertiary-container": "#dbfce4",
                      "surface-bright": "#f8faf9",
                      "surface-container-highest": "#dae5e4",
                      "error-container": "#fe8b70",
                      "secondary-fixed-dim": "#d4d5cf",
                      "on-tertiary-fixed": "#34503e",
                      "on-secondary-fixed": "#3d403c",
                      "on-surface-variant": "#576160",
                      "on-secondary-fixed-variant": "#5a5c58",
                      "inverse-on-surface": "#9b9d9d",
                      "surface": "#f8faf9",
                      "on-secondary-container": "#50524e",
                      "tertiary-fixed-dim": "#cdedd6",
                      "on-primary-fixed": "#004a1c",
                      "secondary-dim": "#515450",
                      "on-secondary": "#f8f9f4",
                      "surface-container-high": "#e1eae9",
                      "secondary-fixed": "#e2e3dd",
                      "error": "#9e422c",
                      "tertiary-fixed": "#dbfce4",
                      "surface-tint": "#006e2d",
                      "surface-container": "#e9efee",
                      "tertiary-dim": "#3d5948",
                      "primary": "#006e2d",
                      "outline-variant": "#a9b4b3",
                      "primary-fixed-dim": "#70ed8a",
                      "on-primary-container": "#005f27",
                      "on-error-container": "#742410",
                      "on-error": "#fff7f6",
                      "background": "#f8faf9"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "fontFamily": {
                      "headline": ["Inter"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
      </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Suppression of Navigation Shell for Transactional Focus -->
<main class="flex-grow flex items-center justify-center px-4">
<!-- Success Confirmation Card -->
<div class="bg-surface-container-lowest border border-outline-variant/20 max-w-md w-full p-12 rounded-xl text-center space-y-8">
<!-- Icon/Visual Anchor -->
<div class="flex justify-center">
<div class="w-16 h-16 bg-tertiary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Content Hierarchy -->
<div class="space-y-3">
<h1 class="text-on-surface font-headline text-3xl font-extrabold tracking-tight">
                    You're all set!
                </h1>
<p class="text-on-surface-variant font-body body-md leading-relaxed">
                    Your profile is ready. We've analyzed your skills and are ready to match you with your first open-source contribution.
                </p>
</div>
<!-- Single Focus CTA -->
<div class="pt-4">
<button class="bg-primary hover:bg-primary-dim text-on-primary font-semibold py-4 px-10 rounded-xl w-full text-lg transition-transform active:scale-95 shadow-sm">
                    Find My Issues
                </button>
</div>
<!-- Technical Detail (Metadata Layer) -->
<div class="pt-2">
<span class="text-on-surface-variant font-label label-sm opacity-60">
                    Step 3 of 3 • Configuration Complete
                </span>
</div>
</div>
</main>
<!-- Editorial Accent Decor (Suppressed distractions but maintaining brand tone) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[30%] h-[30%] bg-tertiary-container/20 rounded-full blur-[100px]"></div>
</div>
</body></html>
